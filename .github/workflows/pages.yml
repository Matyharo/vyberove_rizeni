name: Build and publish investor browser

on:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m investor_db validate
      - run: python -m investor_db build
      - run: python research/audit_database.py
      - run: python -m unittest discover -s tests -v
      - run: node --test frontend/tests/*.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified static package
        id: deployment
        uses: actions/deploy-pages@v4
